<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito','Quicksand','Trebuchet MS',system-ui,-apple-system,sans-serif;
  background:linear-gradient(170deg,#ffeef4 0%,#fdf0fc 45%,#f3e8ff 100%);
  background-attachment:fixed;min-height:100vh;color:#4e2d46;-webkit-font-smoothing:antialiased;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffb6c1' fill-opacity='0.15'%3E%3Cpath d='M30 38c-4-4-10-1-10 4 0 4 4 8 10 12 6-4 10-8 10-12 0-5-6-8-10-4z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"), linear-gradient(170deg,#ffeef4 0%,#fdf0fc 45%,#f3e8ff 100%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input, textarea{font-family:inherit;}
#app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(44px + env(safe-area-inset-bottom));}
.header{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:26px;padding:11px 13px;box-shadow:0 8px 24px rgba(220,150,190,.20);margin-bottom:14px;}
.logo{width:46px;height:46px;border-radius:17px;background:linear-gradient(135deg,#ff9a9e,#fecfef);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;box-shadow:0 4px 12px rgba(255,150,180,.35);}
.titles{flex:1;min-width:0;}
.titles h1{font-size:15.5px;margin:0;font-weight:900;color:#5d3040;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.date{font-size:11.5px;color:#b07f9a;margin-top:2px;font-weight:700;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-btn{width:40px;height:40px;border-radius:15px;background:#fff0f5;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;flex-shrink:0;}
.icon-btn:active{transform:scale(.94);}
.icon-btn.gear{background:transparent;opacity:.55;font-size:16px;width:32px;}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:linear-gradient(135deg,#ff6b9d,#c46fe0);color:#fff;font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(200,100,170,.45);}
.card{background:#fff;border-radius:26px;padding:15px;box-shadow:0 8px 24px rgba(220,150,190,.14);margin-bottom:13px;}
.section-title{font-size:13px;font-weight:900;color:#8a4b76;letter-spacing:.4px;margin:2px 0 10px;}
.summary{background:linear-gradient(135deg,#fff0f5,#fce6ff);border-radius:22px;padding:11px 15px;margin-bottom:13px;text-align:center;box-shadow:0 6px 18px rgba(220,150,200,.13);}
.summary h2{font-size:10.5px;letter-spacing:1.7px;color:#c46fa8;margin:0 0 3px;font-weight:900;}
.summary p{margin:0;font-size:13.5px;color:#7a3e6a;font-weight:800;}
.summary small{display:block;margin-top:2px;font-size:11px;color:#ba89ac;font-weight:700;}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:24px;padding:17px 17px;margin-bottom:11px;box-shadow:0 7px 20px rgba(220,150,200,.17);font-weight:900;font-size:16px;color:#5d3040;transition:transform .12s ease;}
.nav-btn:active{transform:scale(.977);}
.nav-btn .emoji{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.nav-btn.t1 .emoji{background:#e5f1ff;}
.nav-btn.t2 .emoji{background:#ffe9f3;}
.nav-btn.t3 .emoji{background:#efe6ff;}
.nav-btn.t4 .emoji{background:#fff3cd;}
.nav-btn .label{flex:1;text-align:left;}
.nav-btn .arrow{color:#e5a9dd;font-size:22px;font-weight:900;line-height:1;}
.line-btn{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border-radius:20px;padding:13px 14px;margin-bottom:9px;box-shadow:0 5px 16px rgba(220,150,200,.12);transition:transform .12s ease;}
.line-btn:active{transform:scale(.977);}
.line-time{font-size:14.5px;font-weight:900;color:#d95e8c;background:#fff0f5;padding:6px 9px;border-radius:12px;flex-shrink:0;line-height:1.15;}
.line-title{font-size:14.5px;font-weight:900;color:#5d3040;line-height:1.25;}
.line-addr{font-size:12px;color:#9e6a8b;font-weight:800;margin-top:3px;line-height:1.3;}
.line-meta{font-size:11.5px;color:#b5889f;font-weight:800;margin-top:3px;line-height:1.35;}
.line-btn .arrow{color:#e5a9dd;font-size:22px;font-weight:900;line-height:1;align-self:center;flex-shrink:0;}
/* Styles accueil Loisirs */
.line-btn.loisir-home .line-time{color:#b58e00;background:#fff9e6;}
.line-btn.loisir-home .arrow{color:#e5d5a9;}
.empty-card{background:#fff;border-radius:20px;padding:16px;text-align:center;color:#c49db8;font-weight:700;font-size:13px;}
.back{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:18px;padding:9px 16px;font-weight:900;font-size:14px;color:#9a5f8b;box-shadow:0 5px 16px rgba(220,150,200,.16);margin-bottom:13px;}
.back:active{transform:scale(.96);}
.item{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid #fceaf4;}
.item:last-child{border-bottom:none;}
.item-body{flex:1;min-width:0;}
.txt{font-size:14.5px;font-weight:800;color:#5d3040;line-height:1.35;word-break:break-word;}
.item.done .txt{text-decoration:line-through;color:#b8a6b4;}
.chk{width:30px;height:30px;border-radius:11px;border:2.5px solid #f4cbe1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;flex-shrink:0;margin-top:1px;transition:all .15s;}
.item.done .chk{background:#5cc98a;border-color:#5cc98a;}
.del{width:30px;height:30px;border-radius:11px;background:#fff0f5;color:#e08aab;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.del:active{transform:scale(.92);}
.tag{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:900;padding:3px 9px;border-radius:10px;}
.tag.sam{background:#e5f1ff;color:#3a76c4;}
.tag.shera{background:#f0e8ff;color:#8a5fd4;}
.tag.both{background:#ffe6f0;color:#d9588c;}
.empty{text-align:center;color:#c49db8;font-weight:700;font-size:13px;padding:14px 0;}
.form-card{background:#fff;}
.form-title{font-size:13px;font-weight:900;color:#8a4b76;margin-bottom:10px;}
.lbl{display:block;font-size:11.5px;font-weight:900;color:#b5889f;letter-spacing:.5px;margin:12px 0 5px;text-transform:uppercase;}
.inp{width:100%;border:2px solid #fceaf4;background:#fffcfd;border-radius:16px;padding:13px 15px;font-size:15px;font-weight:700;color:#5d3040;outline:none;transition:border-color .15s;}
.inp::placeholder{color:#d8b9cc;font-weight:700;}
.inp:focus{border-color:#ff9a9e;background:#fff;}
.btn-main{width:100%;margin-top:16px;background:linear-gradient(135deg,#ff8fab,#d98ce6);color:#fff;border-radius:20px;padding:16px;font-size:15.5px;font-weight:900;box-shadow:0 8px 20px rgba(255,130,170,.35);}
.btn-main:active{transform:scale(.975);}
.btn-soft{width:100%;margin-top:9px;background:#fff0f5;color:#b05e90;border-radius:16px;padding:12px;font-size:13.5px;font-weight:900;}
.btn-soft:active{transform:scale(.975);}
.chip{margin-top:2px;margin-bottom:9px;background:#fff0f5;border:2px dashed #ffcce0;border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:900;color:#c46fa8;text-align:center;}
.seg{display:flex;gap:7px;margin-top:11px;}
.seg-btn{flex:1;padding:11px 4px;border-radius:15px;background:#fffcfd;font-size:12.5px;font-weight:900;color:#b5889f;border:2px solid transparent;}
.seg-btn.sel.sam{background:#e5f1ff;color:#3a76c4;border-color:#b8d8ff;}
.seg-btn.sel.shera{background:#f0e8ff;color:#8a5fd4;border-color:#d4bcf7;}
.seg-btn.sel.both{background:#ffe6f0;color:#d9588c;border-color:#ffc2da;}
.cal{background:#fffcfd;border-radius:20px;padding:10px;border:2px solid #fceaf4;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-nav{width:36px;height:36px;border-radius:13px;background:#fff;color:#d95e8c;font-size:19px;font-weight:900;box-shadow:0 3px 10px rgba(220,150,200,.18);}
.cal-title{font-size:13.5px;font-weight:900;color:#8a4b76;text-transform:capitalize;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10.5px;color:#d8b9cc;font-weight:900;padding:2px 0;}
.cal-day{min-height:34px;border-radius:11px;background:#fff;font-size:13px;font-weight:900;color:#8a4b76;}
.cal-day.sel{background:linear-gradient(135deg,#ff8fab,#d98ce6);color:#fff;box-shadow:0 4px 12px rgba(220,140,200,.42);}
.time-wrap{display:flex;align-items:stretch;gap:6px;background:#fffcfd;border-radius:20px;padding:8px;border:2px solid #fceaf4;}
.t-col{flex:1;height:176px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;}
.t-colon{display:flex;align-items:center;font-size:20px;font-weight:900;color:#e5a9dd;}
.t-item{flex:0 0 auto;height:44px;border-radius:12px;background:#fff;font-size:15px;font-weight:900;color:#8a4b76;}
.t-item.sel{background:linear-gradient(135deg,#ff8fab,#d98ce6);color:#fff;box-shadow:0 4px 12px rgba(220,140,200,.4);}
.appt-head{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.appt-time{font-size:14px;font-weight:900;color:#d95e8c;background:#fff0f5;padding:3px 8px;border-radius:10px;}
.appt-date{font-size:11.5px;font-weight:800;color:#c49db8;}
.meta{font-size:11.5px;color:#b5889f;font-weight:700;margin-top:3px;}
.addr{font-size:12px;color:#9e6a8b;font-weight:800;margin-top:4px;}
.maps-row{display:flex;gap:7px;margin-top:9px;}
.btn-maps{width:100%;text-align:center;background:#e5f1ff;color:#3a76c4;border-radius:14px;padding:12px 8px;font-size:13px;font-weight:900;text-decoration:none;display:block;}
.btn-maps:active{transform:scale(.97);}
.shop-card{background:#fff;border-radius:24px;padding:14px;box-shadow:0 8px 24px rgba(220,150,200,.14);margin-bottom:13px;}
.shop-head{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.shop-name{flex:1;font-size:15px;font-weight:900;color:#5d3040;}
.shop-count{font-size:12.5px;font-weight:900;color:#d95e8c;background:#fff0f5;padding:4px 11px;border-radius:12px;}
.add-row{display:flex;gap:8px;margin-top:11px;}
.add-row .inp{flex:1;}
.btn-plus{width:52px;height:50px;border-radius:16px;background:linear-gradient(135deg,#ff8fab,#d98ce6);color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 16px rgba(255,130,170,.35);flex-shrink:0;}
.btn-plus:active{transform:scale(.94);}
.notif{padding:11px 0;border-bottom:1px solid #fceaf4;}
.notif:last-child{border-bottom:none;}
.notif-txt{font-size:13.5px;font-weight:800;color:#5d3040;line-height:1.35;}
.notif-time{font-size:10.5px;color:#d8b9cc;font-weight:800;margin-top:3px;}
.hint{font-size:11.5px;color:#c49db8;font-weight:800;text-align:center;margin-top:11px;line-height:1.5;}
.detail-hero{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.detail-time{font-size:20px;font-weight:900;color:#d95e8c;background:#fff0f5;padding:8px 14px;border-radius:16px;}
.detail-date{font-size:13px;font-weight:800;color:#b5889f;}
.detail-title{font-size:19px;font-weight:900;color:#5d3040;line-height:1.3;margin-bottom:14px;}
.detail-row{display:flex;gap:10px;padding:11px 0;border-top:1px solid #fceaf4;}
.detail-lbl{flex:0 0 92px;font-size:11.5px;font-weight:900;color:#b5889f;letter-spacing:.5px;text-transform:uppercase;padding-top:2px;}
.detail-val{flex:1;font-size:14px;font-weight:800;color:#5d3040;line-height:1.4;word-break:break-word;}
#toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,26px);background:#5d3040;color:#fff;font-size:13.5px;font-weight:800;padding:12px 22px;border-radius:18px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:999;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(60,20,60,.35);}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* =========================================
   LE NOUVEAU THÈME "TICKET" POUR LES LOISIRS
   ========================================= */
.ticket{
  display:flex;
  background:#fff;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 4px 12px rgba(200,160,200,0.15);
  position:relative;
  overflow:hidden;
  border:1px solid #f0e2f0;
}
.ticket::before{
  content:'';
  position:absolute;
  left:-6px; top:0; bottom:0;
  width:12px;
  background-image: radial-gradient(circle, #fdf0fc 6px, transparent 7px);
  background-size: 12px 16px;
  background-position: 0 4px;
}
.ticket-left{
  background:linear-gradient(135deg,#f3e8ff,#fff0f5);
  width:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  border-right:2px dashed #e6cfea;
  padding:10px;
  flex-shrink:0;
}
.ticket-right{
  padding:14px;
  flex:1;
  display:flex;
  flex-direction:column;
}
.ticket-date{
  font-size:11px; font-weight:900; color:#d95e8c; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;
}
.ticket-title{
  font-size:16px; font-weight:900; color:#4e2d46; line-height:1.2;
}
.ticket-desc{
  font-size:13px; color:#8e6586; margin-top:6px; font-weight:600; line-height:1.4; white-space:pre-wrap;
}
.ticket-actions{
  display:flex; gap:10px; margin-top:12px; justify-content:flex-end; border-top:1px dashed #f0e2f0; padding-top:10px;
}
.btn-icon{width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px;}
.btn-edit{background:#e5f1ff; color:#3a76c4;}
.row-2{display:flex; gap:10px;}
.row-2 > div {flex:1;}
.btn-cancel{width:100%;margin-top:8px;background:#fdf0fc;color:#b05e90;border-radius:16px;padding:12px;font-size:13.5px;font-weight:900; display:none;}
</style>

<body>
<div id="app"></div>

<script>
var LS_STATE='ms_state_v2', LS_FB='ms_fb_url', LS_CODE='ms_code';
var state={tasks:[],appts:[],shops:[],notifs:[],loisirs:[]};
var fbUrl=localStorage.getItem(LS_FB)||'';
var houseCode=localStorage.getItem(LS_CODE)||'SAMSHERA';
var lastRemoteJson='';
var pushTimer=null;
var currentView='home';
var selectedWho='both';
var calYear=new Date().getFullYear();
var calMonth=new Date().getMonth();
var selectedDate='';
var selHour='00', selMin='00', formTime='', timeTouched=false;
var detailApptId='';
var editingLoisirId=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function val(id){var e=document.getElementById(id);return e?(e.value||'').trim():'';}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function frDate(iso){if(!iso)return '';var p=String(iso).split('-');if(p.length!==3)return iso;return p[2]+'/'+p[1]+'/'+p[0];}
function whoLabel(w){return w==='sam'?'Sam 💙':w==='shera'?'Shera 💜':'Les deux 💖';}
function getLoisirEmoji(title){
  title = (title||'').toLowerCase();
  if(title.includes('cinéma')||title.includes('film')||title.includes('concert'))return '🍿';
  if(title.includes('resto')||title.includes('restaurant'))return '🍽️';
  if(title.includes('week-end')||title.includes('voyage')||title.includes('vol'))return '✈️';
  if(title.includes('spectacle')||title.includes('théâtre'))return '🎭';
  return '🎟️';
}
function normalize(d){d=d||{};var tasks=Array.isArray(d.tasks)?d.tasks:[];var appts=Array.isArray(d.appts)?d.appts:[];var shops=Array.isArray(d.shops)?d.shops:[];var notifs=Array.isArray(d.notifs)?d.notifs:[];var loisirs=Array.isArray(d.loisirs)?d.loisirs:[];shops=shops.map(function(s){s=s||{};var items=Array.isArray(s.items)?s.items:[];items=items.map(function(it){it=it||{};return{id:it.id||uid(),text:it.text||'',done:!!it.done};});return{id:s.id||uid(),name:s.name||'',items:items};});return{tasks:tasks,appts:appts,shops:shops,notifs:notifs,loisirs:loisirs};}
function sanitizeState(){if(!Array.isArray(state.tasks))state.tasks=[];if(!Array.isArray(state.appts))state.appts=[];if(!Array.isArray(state.shops))state.shops=[];if(!Array.isArray(state.notifs))state.notifs=[];if(!Array.isArray(state.loisirs))state.loisirs=[];state.shops.forEach(function(s){if(!s||typeof s!=='object')return;if(!Array.isArray(s.items))s.items=[];});}
function toast(msg){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2300);}
function loadLocal(){try{var s=localStorage.getItem(LS_STATE);if(s)state=normalize(JSON.parse(s));sanitizeState();}catch(e){state={tasks:[],appts:[],shops:[],notifs:[],loisirs:[]};}}
function saveLocal(){try{localStorage.setItem(LS_STATE,JSON.stringify(state));}catch(e){}}
function apiUrl(){if(!fbUrl)return null;var base=fbUrl.replace(/\/+$/,'');return base+'/maison/'+encodeURIComponent(houseCode)+'.json';}
function schedulePush(){saveLocal();if(!apiUrl())return;clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,350);}
function pushNow(){var url=apiUrl();if(!url)return;var json=JSON.stringify(state);lastRemoteJson=json;fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:json}).catch(function(){});}
function poll(){var url=apiUrl();if(!url)return;fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)return null;return r.json();}).then(function(data){if(data===null||data===undefined)return;var clean=normalize(data);var json=JSON.stringify(clean);if(json!==lastRemoteJson){lastRemoteJson=json;state=clean;saveLocal();render();}}).catch(function(){});}
function addNotif(text){state.notifs.unshift({id:uid(),text:text,ts:Date.now()});if(state.notifs.length>120)state.notifs.length=120;}

function render(){try{sanitizeState();}catch(e){}var app=document.getElementById('app');if(!app)return;try{var saved={};Array.prototype.forEach.call(app.querySelectorAll('input, textarea'),function(i){if(i.id)saved[i.id]=i.value;});app.innerHTML=headerHTML()+viewHTML();Object.keys(saved).forEach(function(k){var el=document.getElementById(k);if(el&&!el.value)el.value=saved[k];});if(currentView==='appts'){renderCalendar();renderTime();}}catch(e){try{state.shops.forEach(function(s){if(!Array.isArray(s.items))s.items=[];});app.innerHTML='<div class="card"><div class="section-title">Oups, petit bug réparé ♥</div><div class="empty">Ferme et rouvre l\'app, tout est encore dans Firebase.</div></div>';}catch(e2){}}}

function headerHTML(){var d=new Date();var ds=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});ds=ds.charAt(0).toUpperCase()+ds.slice(1);var remaining=state.tasks.filter(function(t){return !t.done;}).length;var count=remaining+state.appts.length+state.loisirs.filter(function(l){return l.date===todayISO();}).length;return '<div class="header"><div class="logo">🏡❤️</div><div class="titles"><h1>Bonjour, Sam &amp; Shera ! 💕</h1><div class="date">'+esc(ds)+'</div></div><button class="icon-btn" data-act="go-notifs">🔔'+(count>0?'<span class="badge">'+count+'</span>':'')+'</button><button class="icon-btn gear" data-act="go-share">⚙️</button></div>';}

function viewHTML(){switch(currentView){case 'tasks':return tasksHTML();case 'appts':return apptsHTML();case 'appt-detail':return apptDetailHTML();case 'shopping':return shoppingHTML();case 'loisirs':return loisirsHTML();case 'share':return shareHTML();case 'notifs':return notifsHTML();default:return homeHTML();}}

function homeHTML(){
  var remaining=state.tasks.filter(function(t){return !t.done;}).length;
  var apptsCount=state.appts.length;
  var toBuy=state.shops.reduce(function(n,s){return n+(s.items||[]).filter(function(i){return !i.done;}).length;},0);
  var today=todayISO();
  
  var todayAppts=state.appts.filter(function(a){return a.date===today;}).sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''));});
  var todayLoisirs=state.loisirs.filter(function(l){return l.date===today;}).sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''));});
  
  var h='';
  h+='<div class="summary"><h2>RÉSUMÉ DU JOUR ♥</h2><p>Une douce journée à la maison.</p><small>Avancez à notre rythme, ensemble. 💕</small></div>';
  
  h+='<button class="nav-btn t1" data-act="go-tasks"><span class="emoji">✅</span><span class="label">'+remaining+' tâche'+(remaining>1?'s':'')+' restante'+(remaining>1?'s':'')+'</span><span class="arrow">›</span></button>';
  h+='<button class="nav-btn t2" data-act="go-appts"><span class="emoji">📅</span><span class="label">'+apptsCount+' rendez-vous</span><span class="arrow">›</span></button>';
  h+='<button class="nav-btn t3" data-act="go-shopping"><span class="emoji">🛒</span><span class="label">'+toBuy+' article'+(toBuy>1?'s':'')+' à acheter</span><span class="arrow">›</span></button>';
  h+='<button class="nav-btn t4" data-act="go-loisirs"><span class="emoji">🎟️</span><span class="label">'+state.loisirs.length+' loisirs</span><span class="arrow">›</span></button>';
  
  h+='<div class="section-title" style="margin-top:16px">📅 Rendez-vous du jour ♥</div>';
  if(todayAppts.length){todayAppts.forEach(function(a){h+=apptLineHTML(a);});}else{h+='<div class="empty-card">Aucun rendez-vous aujourd\'hui.</div>';}
  
  h+='<div class="section-title" style="margin-top:16px">🎟️ Loisirs du jour</div>';
  if(todayLoisirs.length){
    todayLoisirs.forEach(function(l){
      var emoji = getLoisirEmoji(l.title);
      h+='<button class="line-btn loisir-home" data-act="go-loisirs"><div class="line-time">'+esc(l.time||'Journée')+'</div><div class="item-body"><div class="line-title">'+emoji+' '+esc(l.title)+'</div>'+(l.desc?'<div class="line-addr">'+esc(l.desc)+'</div>':'')+'</div><div class="arrow">›</div></button>';
    });
  }else{
    h+='<div class="empty-card">Aucun loisir aujourd\'hui.</div>';
  }
  
  return h;
}

function apptLineHTML(a){var meta=[];if(a.forWho)meta.push('Pour : '+esc(a.forWho));if(a.withWho)meta.push('Avec : '+esc(a.withWho));return '<button class="line-btn" data-act="open-appt" data-id="'+a.id+'"><div class="line-time">'+esc(a.time||'--:--')+'</div><div class="item-body"><div class="line-title">'+esc(a.title||a.forWho||'Rendez-vous')+'</div>'+(a.address?'<div class="line-addr">📍 '+esc(a.address)+'</div>':'')+(meta.length?'<div class="line-meta">'+meta.join(' · ')+'</div>':'')+'</div><div class="arrow">›</div></button>';}

function tasksHTML(){var h='<button class="back" data-act="go-home">‹ Retour</button>';h+='<div class="card"><div class="section-title">✅ Tâches</div>';if(state.tasks.length){state.tasks.forEach(function(t){h+=taskItemHTML(t);});}else{h+='<div class="empty">Aucune tâche pour le moment.</div>';}h+='</div>';h+='<div class="card form-card"><div class="form-title">Ajouter une nouvelle tâche</div>';h+='<input class="inp" id="taskText" placeholder="Écrire..." autocomplete="off">';h+='<div class="seg" id="taskWho">';h+=segBtn('sam','Sam 💙');h+=segBtn('shera','Shera 💜');h+=segBtn('both','Les deux 💖');h+='</div><button class="btn-main" data-act="add-task">+ Ajouter la tâche</button></div>';return h;}

function apptsHTML(){var list=state.appts.slice().sort(function(a,b){return (String(a.date||'')+String(a.time||'')).localeCompare(String(b.date||'')+String(b.time||''));});var h='<button class="back" data-act="go-home">‹ Retour</button>';h+='<div class="card"><div class="section-title">📅 Rendez-vous</div>';if(list.length){list.forEach(function(a){h+='<div class="line-btn" style="margin-bottom:9px" data-act="open-appt" data-id="'+a.id+'"><div class="line-time">'+esc(a.time||'--:--')+'<div style="font-size:10px;font-weight:800;color:#b39cbc;margin-top:2px">'+esc(frDate(a.date))+'</div></div><div class="item-body"><div class="line-title">'+esc(a.title||a.forWho||'Rendez-vous')+'</div>'+(a.address?'<div class="line-addr">📍 '+esc(a.address)+'</div>':'')+((a.forWho||a.withWho)?'<div class="line-meta">'+(a.forWho?'Pour : '+esc(a.forWho):'')+(a.forWho&&a.withWho?' · ':'')+(a.withWho?'Avec : '+esc(a.withWho):'')+'</div>':'')+'</div><div class="arrow">›</div></div>';});}else{h+='<div class="empty">Aucun rendez-vous pour le moment.</div>';}h+='</div>';h+='<div class="card form-card"><div class="form-title">Ajouter un nouveau rendez-vous</div>';h+='<label class="lbl">Titre</label><input class="inp" id="apTitle" placeholder="Écrire..." autocomplete="off">';h+='<label class="lbl">Pour qui ?</label><input class="inp" id="apFor" placeholder="Écrire..." autocomplete="off">';h+='<label class="lbl">Avec qui ?</label><input class="inp" id="apWith" placeholder="Écrire..." autocomplete="off">';h+='<label class="lbl">Date</label><div class="chip" id="dateChip">'+(selectedDate?frDate(selectedDate):'Aucune date choisie')+'</div><div class="cal" id="calBox"></div><button class="btn-soft" data-act="confirm-date">Confirmer la date</button>';h+='<label class="lbl">Heure</label><div class="chip" id="timeChip">'+(formTime?formTime:'Aucune heure choisie')+'</div><div class="time-wrap" id="timeBox"></div><button class="btn-soft" data-act="confirm-time">Confirmer l\'heure</button>';h+='<label class="lbl">Adresse</label><input class="inp" id="apAddr" placeholder="Écrire..." autocomplete="off">';h+='<button class="btn-main" data-act="add-appt">+ Ajouter le rendez-vous</button></div>';return h;}

function apptDetailHTML(){var a=state.appts.filter(function(x){return x.id===detailApptId;})[0];if(!a){return '<button class="back" data-act="go-home">‹ Retour</button><div class="card"><div class="empty">Rendez-vous introuvable.</div></div>';}var q=encodeURIComponent(a.address||'');var h='<button class="back" data-act="back-from-detail">‹ Retour</button><div class="card">';h+='<div class="detail-hero"><div class="detail-time">'+esc(a.time||'--:--')+'</div><div class="detail-date">'+esc(frDate(a.date))+'</div></div>';h+='<div class="detail-title">'+esc(a.title||a.forWho||'Rendez-vous')+'</div>';if(a.forWho)h+='<div class="detail-row"><div class="detail-lbl">Pour qui</div><div class="detail-val">'+esc(a.forWho)+'</div></div>';if(a.withWho)h+='<div class="detail-row"><div class="detail-lbl">Avec qui</div><div class="detail-val">'+esc(a.withWho)+'</div></div>';if(a.address)h+='<div class="detail-row"><div class="detail-lbl">Adresse</div><div class="detail-val">'+esc(a.address)+'</div></div>';h+='<div class="maps-row" style="margin-top:14px"><a class="btn-maps" href="https://www.google.com/maps/search/?api=1&amp;query='+q+'" target="_blank" rel="noopener">Ouvrir dans Maps</a></div>';h+='<button class="btn-soft" style="margin-top:12px;background:#fff0f5;color:#d9588c" data-act="del-appt-detail" data-id="'+a.id+'">Supprimer ce rendez-vous</button></div>';return h;}

function renderCalendar(){var box=document.getElementById('calBox');if(!box)return;var y=calYear,m=calMonth;var first=new Date(y,m,1);var startDow=(first.getDay()+6)%7;var daysInMonth=new Date(y,m+1,0).getDate();var mois=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];var h='<div class="cal-head"><button class="cal-nav" data-act="cal-prev">‹</button><div class="cal-title">'+mois[m]+' '+y+'</div><button class="cal-nav" data-act="cal-next">›</button></div><div class="cal-grid">';['L','M','M','J','V','S','D'].forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});for(var i=0;i<startDow;i++)h+='<div></div>';for(var d=1;d<=daysInMonth;d++){var iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');h+='<button class="cal-day'+(iso===selectedDate?' sel':'')+'" data-act="cal-day" data-date="'+iso+'">'+d+'</button>';}h+='</div>';box.innerHTML=h;}

function renderTime(){var box=document.getElementById('timeBox');if(!box)return;var hoursHtml='',minsHtml='';for(var i=0;i<24;i++){var hh=String(i).padStart(2,'0');hoursHtml+='<button class="t-item'+(hh===selHour?' sel':'')+'" data-act="t-hour" data-v="'+hh+'">'+hh+'</button>';}for(var j=0;j<60;j++){var mm=String(j).padStart(2,'0');minsHtml+='<button class="t-item'+(mm===selMin?' sel':'')+'" data-act="t-min" data-v="'+mm+'">'+mm+'</button>';}box.innerHTML='<div class="t-col" id="tHours">'+hoursHtml+'</div><div class="t-colon">:</div><div class="t-col" id="tMins">'+minsHtml+'</div>';var hc=document.getElementById('tHours');var mc=document.getElementById('tMins');if(hc)hc.scrollTop=Math.max(0,parseInt(selHour,10)*47-60);if(mc)mc.scrollTop=Math.max(0,parseInt(selMin,10)*47-60);}

function loisirsHTML(){
  var list = state.loisirs.slice().sort(function(a,b){
    return (String(a.date||'')+String(a.time||'')).localeCompare(String(b.date||'')+String(b.time||''));
  });
  
  var itemsHTML = list.map(function(item){
    var dateStr = 'Date libre';
    if (item.date) {
      const d = new Date(item.date + 'T12:00:00');
      dateStr = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
      if (item.time) dateStr += ' à ' + item.time;
    } else if (item.time) {
      dateStr = 'À ' + item.time;
    }
    var emoji = getLoisirEmoji(item.title);

    return `
    <div class="ticket">
      <div class="ticket-left">${emoji}</div>
      <div class="ticket-right">
        <div class="ticket-date">${dateStr}</div>
        <div class="ticket-title">${esc(item.title)}</div>
        ${item.desc ? `<div class="ticket-desc">${esc(item.desc)}</div>` : ''}
        <div class="ticket-actions">
          <button class="btn-icon btn-edit" data-act="edit-loisir" data-id="${item.id}">✏️</button>
          <button class="btn-icon del" data-act="del-loisir" data-id="${item.id}">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');

  let editItem = editingLoisirId ? state.loisirs.find(i => i.id === editingLoisirId) : { title: '', date: '', time: '', desc: '' };

  var h = '<button class="back" data-act="go-home">‹ Retour</button>';
  h += '<div class="card" style="background:transparent; box-shadow:none; padding:0;">';
  h += itemsHTML.length > 0 ? itemsHTML : '<div class="empty" style="background:#fff; border-radius:20px; padding:20px;">Aucun loisir noté pour le moment.</div>';
  h += '</div>';

  h += '<div class="card form-card">';
  h += '<div class="form-title">'+(editingLoisirId ? 'Modifier le loisir' : 'Ajouter un loisir')+'</div>';
  h += '<label class="lbl">Titre (ex: Billets spectacle, Week-end...)</label>';
  h += '<input class="inp" id="loisirTitle" placeholder="Écrire..." value="'+esc(editItem.title)+'">';
  
  h += '<div class="row-2">';
  h += '<div><label class="lbl">Date</label><input class="inp" id="loisirDate" type="date" value="'+esc(editItem.date)+'"></div>';
  h += '<div><label class="lbl">Heure</label><input class="inp" id="loisirTime" type="time" value="'+esc(editItem.time)+'"></div>';
  h += '</div>';
  
  h += '<label class="lbl">Détails / Notes (optionnel)</label>';
  h += '<textarea class="inp" id="loisirDesc" placeholder="Écrire..." rows="3">'+esc(editItem.desc)+'</textarea>';
  
  h += '<button class="btn-main" data-act="add-loisir">'+(editingLoisirId ? '✓ Enregistrer les modifications' : '+ Ajouter le loisir')+'</button>';
  h += '<button class="btn-cancel" style="'+(editingLoisirId?'display:block':'display:none')+'" data-act="cancel-edit-loisir">Annuler la modification</button>';
  h += '</div>';
  
  return h;
}

function shoppingHTML(){var h='<button class="back" data-act="go-home">‹ Retour</button>';if(!state.shops.length){h+='<div class="card"><div class="empty">Aucune liste pour le moment.</div></div>';}state.shops.forEach(function(s){var done=s.items.filter(function(i){return i.done;}).length;h+='<div class="shop-card"><div class="shop-head"><div class="shop-name">🛒 '+esc(s.name)+'</div><div class="shop-count">'+done+'/'+s.items.length+'</div><button class="del" data-act="del-shop" data-id="'+s.id+'">✕</button></div>';if(s.items.length){s.items.forEach(function(it){h+='<div class="item'+(it.done?' done':'')+'"><button class="chk" data-act="toggle-item" data-id="'+it.id+'">'+(it.done?'✓':'')+'</button><div class="item-body"><div class="txt">'+esc(it.text)+'</div></div><button class="del" data-act="del-item" data-id="'+it.id+'">✕</button></div>';});}else{h+='<div class="empty">Aucun article.</div>';}h+='<div class="add-row"><input class="inp" id="item-'+s.id+'" placeholder="Écrire un article" autocomplete="off"><button class="btn-plus" data-act="add-item" data-id="'+s.id+'">+</button></div></div>';});h+='<div class="card form-card"><div class="form-title">Créer une nouvelle liste avec nom du magasin</div><input class="inp" id="newShopName" placeholder="Écrire..." autocomplete="off"><button class="btn-main" data-act="add-shop">+ Créer la liste</button></div>';return h;}

function shareHTML(){var h='<button class="back" data-act="go-home">‹ Retour</button>';h+='<div class="card form-card"><div class="section-title">⚙️ Partage</div><label class="lbl">Code Maison</label><input class="inp" id="shareCode" value="'+esc(houseCode)+'" placeholder="Écrire..." autocomplete="off"><label class="lbl">URL Firebase</label><input class="inp" id="shareUrl" value="'+esc(fbUrl)+'" placeholder="Écrire..." autocomplete="off"><button class="btn-main" data-act="save-share">Enregistrer le partage</button><div class="hint">Même Code Maison sur les deux téléphones = mêmes données, en temps réel.</div></div>';return h;}

function notifsHTML(){var h='<button class="back" data-act="go-home">‹ Retour</button><div class="card"><div class="section-title">🔔 Historique</div>';if(state.notifs.length){state.notifs.forEach(function(n){var d=new Date(n.ts);h+='<div class="notif"><div class="notif-txt">'+esc(n.text)+'</div><div class="notif-time">'+esc(d.toLocaleString('fr-FR'))+'</div></div>';});}else{h+='<div class="empty">Aucun changement pour le moment.</div>';}h+='</div>';return h;}

function commit(notifText){if(notifText)addNotif(notifText);schedulePush();render();}

document.addEventListener('click',function(e){var el=e.target.closest?e.target.closest('[data-act]'):null;if(!el)return;var act=el.getAttribute('data-act');var id=el.getAttribute('data-id');
if(act==='go-home'){currentView='home';detailApptId='';render();return;}

if(act==='del-task'){var dt=state.tasks.filter(function(x){return x.id===id;})[0];state.tasks=state.tasks.filter(function(x){return x.id!==id;});commit('Tâche supprimée : '+(dt?dt.text:''));return;}

if(act==='cal-day'){selectedDate=el.getAttribute('data-date');var days=document.querySelectorAll('#calBox .cal-day');Array.prototype.forEach.call(days,function(b){b.classList.toggle('sel',b.getAttribute('data-date')===selectedDate);});var chip=document.getElementById('dateChip');if(chip)chip.textContent=frDate(selectedDate);return;}

if(act==='t-min'){selMin=el.getAttribute('data-v');timeTouched=true;var ms=document.querySelectorAll('#tMins .t-item');Array.prototype.forEach.call(ms,function(b){b.classList.toggle('sel',b.getAttribute('data-v')===selMin);});var tc2=document.getElementById('timeChip');if(tc2)tc2.textContent=selHour+':'+selMin;return;}

if(act==='del-appt'){var da=state.appts.filter(function(x){return x.id===id;})[0];state.appts=state.appts.filter(function(x){return x.id!==id;});commit('Rendez-vous supprimé : '+(da?(da.title||da.forWho||'Rendez-vous'):''));return;}
if(act==='del-appt-detail'){var dad=state.appts.filter(function(x){return x.id===id;})[0];state.appts=state.appts.filter(function(x){return x.id!==id;});addNotif('Rendez-vous supprimé : '+(dad?(dad.title||dad.forWho||'Rendez-vous'):''));detailApptId='';currentView='home';schedulePush();render();return;}
if(act==='add-item'){var inp2=document.getElementById('item-'+id);var txt=(inp2.value||'').trim();if(!txt){inp2.focus();toast('Écrivez d\'abord un article.');return;}var shop=state.shops.filter(function(s){return s.id===id;})[0];if(!shop)return;if(!Array.isArray(shop.items))shop.items=[];shop.items.push({id:uid(),text:txt,done:false});inp2.value='';toast('Article ajouté !');commit('Article ajouté ('+shop.name+') : '+txt);return;}
if(act==='toggle-item'){for(var i=0;i<state.shops.length;i++){var arr=state.shops[i].items||[];state.shops[i].items=arr;for(var k=0;k<arr.length;k++){if(arr[k].id===id){arr[k].done=!arr[k].done;commit(arr[k].done?'Article coché : '+arr[k].text:'Article décoché : '+arr[k].text);return;}}}return;}
if(act==='del-item'){for(var s1=0;s1<state.shops.length;s1++){var it=(state.shops[s1].items||[]).filter(function(x){return x.id===id;})[0];if(it){state.shops[s1].items=(state.shops[s1].items||[]).filter(function(x){return x.id!==id;});commit('Article supprimé : '+it.text);return;}}return;}
if(act==='del-shop'){var sh=state.shops.filter(function(s){return s.id===id;})[0];state.shops=state.shops.filter(function(s){return s.id!==id;});commit('Liste supprimée : '+(sh?sh.name:''));return;}
if(act==='add-shop'){var ni=document.getElementById('newShopName');var nomMag=(ni.value||'').trim();if(!nomMag){ni.focus();toast('Écrivez le nom du magasin.');return;}state.shops.push({id:uid(),name:nomMag,items:[]});ni.value='';toast('Liste créée !');commit('Nouvelle liste créée : '+nomMag);return;}
if(act==='save-share'){var code=(val('shareCode')||'SAMSHERA');var url=(val('shareUrl')||'').replace(/\/+$/,'');houseCode=code;fbUrl=url;localStorage.setItem(LS_CODE,code);localStorage.setItem(LS_FB,url);lastRemoteJson='';toast('Partage enregistré.');poll();return;}

/* LOISIRS */
if(act==='add-loisir'){
  var lTitle=val('loisirTitle'), lDate=val('loisirDate'), lTime=val('loisirTime'), lDesc=val('loisirDesc');
  if(!lTitle){toast('Écrivez un titre.');return;}
  if(editingLoisirId){
    var idx=state.loisirs.findIndex(function(x){return x.id===editingLoisirId;});
    if(idx>-1){state.loisirs[idx]={id:editingLoisirId,title:lTitle,date:lDate,time:lTime,desc:lDesc};}
    editingLoisirId=null;
    toast('Loisir modifié !');
    commit('Loisir modifié : '+lTitle);
  }else{
    state.loisirs.push({id:uid(),title:lTitle,date:lDate,time:lTime,desc:lDesc});
    toast('Loisir ajouté !');
    commit('Nouveau loisir : '+lTitle);
  }
  return;
}
if(act==='edit-loisir'){
  editingLoisirId=id;
  render();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  return;
}
if(act==='cancel-edit-loisir'){
  editingLoisirId=null;
  render();
  return;
}
if(act==='del-loisir'){
  var dl=state.loisirs.filter(function(x){return x.id===id;})[0];
  state.loisirs=state.loisirs.filter(function(x){return x.id!==id;});
  commit('Loisir supprimé : '+(dl?dl.title:''));
  return;
}
});

loadLocal();
render();
setInterval(poll,3000);
setTimeout(poll,600);
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
window.addEventListener('online',function(){poll();});
</script>
</body>
</html>
